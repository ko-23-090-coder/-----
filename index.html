<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Монитор статусов</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    h2 { margin-top: 30px; }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .auth-buttons {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }

    .buttons button, .auth-buttons button {
      margin: 5px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .blue   { background: #3498db; }
    .brown  { background: #8e5a3c; }
    .green  { background: #2ecc71; }
    .gray   { background: #7f8c8d; }
    .red    { background: #e74c3c; }
    .google { background: #4285F4; }

    .user-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    small { color: #666; }
  </style>
</head>

<body>

<!-- Авторизация -->
<div class="card">
  <h2>Авторизация</h2>
  <div class="auth-buttons">
    <button class="google" onclick="login()">Войти через Google</button>
    <button class="red"    onclick="logout()">Выйти</button>
  </div>
  <div id="authInfo">Вы не вошли</div>
</div>

<!-- Мой профиль -->
<div class="card">
  <h2>Мой статус</h2>
  <div id="myInfo">—</div>
  <div class="buttons">
    <button class="blue"  onclick="changeStatus('Учусь', 'blue')">Учусь</button>
    <button class="brown" onclick="changeStatus('Кофе', 'brown')">Кофе</button>
    <button class="green" onclick="changeStatus('В игре', 'green')">В игре</button>
    <button class="gray"  onclick="changeStatus('Дома', 'gray')">Дома</button>
  </div>
</div>

<!-- Группа -->
<div class="card">
  <h2>Монитор группы</h2>
  <div id="grouplist">Загрузка...</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

// 🔑 ТВОИ ДАННЫЕ — оставь как есть
const SUPABASE_URL = 'https://fxizqmbaadnpzabrpvra.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lvVH1QsN5oTesoxu-VwLoQ_8hEMTNwx';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

// ─── Вход через Google ───────────────────────────────────────────
window.login = async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: 'https://ko-23-090-coder.github.io/-----/'
    }
  });
  if (error) console.error('Login error:', error);
};

// ─── Выход ──────────────────────────────────────────────────────
window.logout = async () => {
  await supabase.auth.signOut();
  location.reload();
};

// ─── Смена статуса ──────────────────────────────────────────────
window.changeStatus = async (text, color) => {
  if (!currentUser) {
    alert('Сначала войдите!');
    return;
  }

  let updateData = {
    status: text,
    color: color
  };

  // ▶ НАЧАЛ УЧИТЬСЯ
  if (text === 'Учусь') {
  const { data } = await supabase
    .from('profiles')
    .select('study_start')
    .eq('id', currentUser.id)
    .single();

  if (!data?.study_start) {
    updateData.study_start = new Date().toISOString();
  }
} else {
    // ▶ ВЫШЕЛ ИЗ УЧЕБЫ
    const { data } = await supabase
      .from('profiles')
      .select('study_start, total_study_seconds')
      .eq('id', currentUser.id)
      .single();

    if (data?.study_start) {
      const seconds = Math.floor(
        (new Date() - new Date(data.study_start)) / 1000
      );

      updateData.total_study_seconds =
        (data.total_study_seconds || 0) + seconds;

      updateData.study_start = null;
    }
  }

  await supabase
    .from('profiles')
    .update(updateData)
    .eq('id', currentUser.id);

  fetchGroup();
};

// ─── Получить текущего пользователя ─────────────────────────────
async function getUser() {
  const { data: { user } } = await supabase.auth.getUser();
  currentUser = user;

  if (user) {
    document.getElementById('authInfo').innerText = `Вошли как: ${user.email}`;
  } else {
    document.getElementById('authInfo').innerText = 'Вы не вошли';
    document.getElementById('myInfo').innerText = '—';
  }
}

// ─── Создать профиль если его нет ───────────────────────────────
async function ensureProfile() {
  if (!currentUser) return;

  const { data } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .single();

  if (!data) {
    await supabase.from('profiles').insert({
      id: currentUser.id,
      username: currentUser.email,
      status: 'Новенький',
      color: 'gray'
    });
  }
}

// ─── Загрузить группу ───────────────────────────────────────────
async function fetchGroup() {
  const { data, error } = await supabase
    .from('profiles')
    .select('*')
    .order('username', { ascending: true });

  if (error) { console.error(error); return; }

  const list = document.getElementById('grouplist');
  const now = new Date();
  list.innerHTML = data.map(user => {
  let total = user.total_study_seconds || 0;

  if (user.study_start) {
    total += Math.floor(
      (now - new Date(user.study_start)) / 1000
    );
  }

  return `
    <div class="user-item">
      <div class="status-dot" style="background:${user.color || '#ccc'}"></div>
      <div>
        <strong>${user.username}</strong><br>
        <small>${user.status || 'Статус не задан'}</small><br>
        <small>Учеба: ${formatTime(total)}</small>
      </div>
    </div>
  `;
}).join('');

  if (currentUser) {
    const me = data.find(u => u.id === currentUser.id);
    if (me) {
      document.getElementById('myInfo').innerText =
        `${me.username} — ${me.status || 'статус не задан'}`;
    }
  }
}
function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${h}ч ${m}м ${s}с`;
}
// ─── Запуск ─────────────────────────────────────────────────────
async function init() {
  await getUser();
  await ensureProfile();
  await fetchGroup();
}

init();
setInterval(fetchGroup, 1000);

  window.addEventListener('beforeunload', async () => {
  if (!currentUser) return;

  const { data } = await supabase
    .from('profiles')
    .select('study_start, total_study_seconds')
    .eq('id', currentUser.id)
    .single();

  if (data?.study_start) {
    const seconds = Math.floor(
      (new Date() - new Date(data.study_start)) / 1000
    );

    await supabase
      .from('profiles')
      .update({
        total_study_seconds:
          (data.total_study_seconds || 0) + seconds,
        study_start: null
      })
      .eq('id', currentUser.id);
  }
});
</script>
</body>
</html>
